
services:
  redis:
    image: redis:7
    container_name: bashchat-redis
    ports:
      - "6379:6379"

  django:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bashchat-django
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      - redis

  nginx:
    image: nginx:latest
    container_name: bashchat-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - django