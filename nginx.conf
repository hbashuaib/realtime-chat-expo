worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # HTTP redirect to HTTPS
    server {
        listen 80;
        server_name bashchat.local;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS reverse proxy to Django
    server {
        listen 443 ssl;
        server_name bashchat.local;

        ssl_certificate     /etc/nginx/certs/bashchat.local+2.pem;
        ssl_certificate_key /etc/nginx/certs/bashchat.local+2-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://bashchat-django:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket connections
        location /chat/ {
            proxy_pass http://bashchat-django:8000/chat/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}